<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suivi des cautions</title>
<style>
:root{--bg:#F2F5F1;--surface:#fff;--ink:#0F2419;--muted:#566B5E;--line:#D5DED7;--accent:#0E7C4A;--accent-ink:#fff;--soft:#E4EFE7;--danger:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1812;--surface:#13241B;--ink:#E8F1EB;--muted:#9DB3A5;--line:#25392D;--accent:#3FBF82;--accent-ink:#06130C;--soft:#183226;--danger:#F97066;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0}.note{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
input,button{font:inherit;font-size:16px;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:var(--bg);color:var(--ink);min-width:0}
button{cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1 1 220px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);white-space:nowrap}tr:last-child td{border:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted)}.pill.ok{background:var(--soft);color:var(--accent)}.pill.ko{color:var(--danger)}
.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Suivi des cautions</h1>
  <section class="panel" id="login">
    <p class="note">Entrez le mot de passe défini dans ADMIN_PASSWORD.</p>
    <form class="row" id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe"><button type="submit">Ouvrir</button></form>
    <p class="err" id="lerr" role="alert"></p>
  </section>
  <section class="panel" id="main" hidden></section>
</div>
<script>
(function(){
  var pw="",rows=[],info={},q="";
  var $=function(i){return document.getElementById(i)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fcfa(n){return Number(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA"}
  function ph(s){return String(s||"").replace(/^(\d{2})(\d{3})(\d{2})(\d{2})$/,"$1 $2 $3 $4")}
  async function load(){
    var r=await fetch("/api/admin/inscriptions",{headers:{Authorization:"Basic "+btoa("admin:"+pw)}});
    var j=await r.json();if(!r.ok)throw new Error(j.erreur||"Erreur");
    rows=j.inscriptions;info=j;
  }
  function render(){
    var paid=rows.filter(function(r){return r.statut==="Payé"});
    var total=paid.reduce(function(a,r){return a+r.montant},0);
    var s=q.toLowerCase();
    var list=rows.filter(function(r){return !s||(r.nom+" "+r.prenom+" "+r.ref+" "+r.table+" "+r.etab+" "+r.statut).toLowerCase().indexOf(s)>-1});
    $("main").innerHTML='<div class="stats"><div class="stat"><b>'+rows.length+'</b><span>Dossiers</span></div><div class="stat"><b>'+paid.length+'</b><span>Payés</span></div><div class="stat"><b>'+(rows.length-paid.length)+'</b><span>Non payés</span></div><div class="stat"><b>'+fcfa(total)+'</b><span>Encaissé'+(info.env==="test"?' (mode test)':'')+'</span></div></div>'+
    '<div class="row"><input id="q" type="search" placeholder="Rechercher un nom, un code, un statut" value="'+esc(q)+'" aria-label="Rechercher"><button class="ghost" id="rl">Actualiser</button><button id="csv">Exporter en CSV</button></div>'+
    (list.length?'<div class="tw"><table><thead><tr><th>Code</th><th>Bachelier</th><th>Table · série</th><th>Établissement</th><th>Statut</th><th>Paiement</th><th class="n">Montant</th><th>Date</th></tr></thead><tbody>'+
    list.map(function(r){var c=r.statut==="Payé"?"ok":(r.statut==="En attente"?"":"ko");return '<tr><td><b>'+esc(r.ref)+'</b></td><td>'+esc(r.prenom+" "+r.nom)+'<br><span class="note">'+esc(ph(r.tel))+' · tuteur '+esc(ph(r.teltuteur))+'</span></td><td>'+esc(r.table)+' · '+esc(r.serie)+'<br><span class="note">'+esc(r.mention)+'</span></td><td>'+esc(r.etab)+'</td><td><span class="pill '+c+'">'+esc(r.statut)+'</span></td><td>'+esc(r.mode||"—")+'</td><td class="n">'+fcfa(r.montant)+'</td><td>'+new Date(r.createdAt).toLocaleDateString("fr-FR")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="note">Aucun dossier à afficher.</p>');
    var qi=$("q");qi.oninput=function(){q=qi.value;var p=qi.selectionStart;render();var n=$("q");n.focus();n.setSelectionRange(p,p)};
    $("rl").onclick=function(){load().then(render)};
    $("csv").onclick=function(){
      var cols=["ref","prenom","nom","naissance","tel","table","serie","mention","ville","lycee","etab","tuteur","teltuteur","statut","mode","numpay","montant","env","createdAt","paidAt"];
      var cell=function(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
      var csv="﻿"+cols.join(";")+"\n"+list.map(function(r){return cols.map(function(c){return cell(r[c])}).join(";")}).join("\n");
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="inscriptions-caution.csv";a.click();
    };
  }
  $("lf").addEventListener("submit",async function(ev){
    ev.preventDefault();pw=$("pw").value;$("lerr").textContent="";
    try{await load();$("login").hidden=true;$("main").hidden=false;render()}catch(e){$("lerr").textContent=e.message}
  });
})();
</script>
</body>
</html>
